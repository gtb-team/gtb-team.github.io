<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>GTB 참석신청</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="GTB 참석신청">
<meta property="og:description" content="참석 신청 · 월회비 신청">
<meta property="og:type" content="website">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&text=0123456789%3A-%2C&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&text=0123456789%3A-%2C&display=swap"></noscript>
<style>
  :root {
    --desk: #E7EBF0; --paper: #FFFFFF; --ink: #17202B; --ink-2: #566273; --line: #D3DAE3;
    --sun: #CF2F3B; --sat: #2456D3; --go: #0B7F57; --go-bg: #E3F3EB; --note-bg: #F3F5F8;
    --num: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif-condensed, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #0E1216; --paper: #171D25; --ink: #E9EDF2; --ink-2: #9BA7B6; --line: #2A333F;
      --sun: #FF6F78; --sat: #7AA2FF; --go: #56D3A4; --go-bg: #143329; --note-bg: #1F2731;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 16px/1.5 var(--body); word-break: keep-all; overflow-wrap: anywhere; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sat); outline-offset: 2px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .sheet { max-width: 520px; min-height: 100vh; margin: 0 auto; background: var(--paper); padding-bottom: 128px; }   /* 아래 여백: 떠 있는 버튼이 바닥글을 가리지 않게 */

  /* 머리말 */
  /* 머리말(과 운영진 탭)은 스크롤해도 화면 위에 붙어 있다. 목록을 위·아래로 끝없이 불러오기 때문에 맨 위로 돌아가지 않아도 닿아야 한다. */
  .stick { position: -webkit-sticky; position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 56px; }
  .top__text { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top p { margin: 1px 0 0; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top p b { color: var(--ink); font-weight: 700; }
  .jump { position: fixed; right: max(16px, calc(50% - 244px)); bottom: 72px; z-index: 15; min-height: 40px; padding: 8px 14px; border: 0; border-radius: 20px;
    background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 700; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
  .jump[hidden] { display: none; }
  .linkbtn { background: none; border: 0; padding: 8px 4px; font-size: 14px; color: var(--sat); text-decoration: underline; text-underline-offset: 3px; }

  .tabs { display: flex; border-top: 1px solid var(--line); padding: 0 8px; }
  .tabs button { flex: none; background: none; border: 0; padding: 9px 10px 7px; min-height: 40px; font-size: 14.5px; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tabs .badge { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 10px; background: var(--sun); color: #fff; font: 700 14px/20px var(--num); text-align: center; }

  /* 하루 = 일력 한 장 */
  .day { display: flex; gap: 14px; padding: 20px 16px; border-top: 1px dashed var(--line); }
  .day:first-of-type { border-top: 0; }
  .leaf { position: sticky; top: 10px; align-self: flex-start; flex: none; width: 62px; text-align: center; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
  .leaf__month { background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; line-height: 20px; border-radius: 3px 3px 0 0; }
  .leaf__num { font: 700 46px/1 var(--num); padding: 7px 0 1px; }
  .leaf__dow { font-size: 12px; font-weight: 700; padding-bottom: 7px; }
  .leaf--sun .leaf__num, .leaf--sun .leaf__dow { color: var(--sun); }
  .leaf--sat .leaf__num, .leaf--sat .leaf__dow { color: var(--sat); }
  .leaf--sun .leaf__month { background: var(--sun); color: #fff; }
  .leaf__rel { border-top: 1px solid var(--line); font-size: 12px; font-weight: 800; line-height: 22px; }
  .leaf__ft { border-top: 1px solid var(--line); padding: 4px 3px 5px; font-size: 11px; line-height: 1.25; color: var(--ink-2); }
  .leaf__ft b { display: block; font-size: 12px; color: var(--ink); word-break: keep-all; }
  .leaf__ft i { display: block; margin-top: 1px; font: 700 12px/1 var(--num); font-style: normal; color: var(--sun); }
  .tagx--ft { color: #8a5a00; border-color: #e0a800; }
  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 15px; }
  .rank li:first-child { border-top: 0; }
  .rank .no { width: 22px; font: 700 15px/1 var(--num); color: var(--ink-2); }
  .rank b { flex: 1; font-weight: 700; }
  .rank i { font: 700 18px/1 var(--num); font-style: normal; color: var(--sun); }
  .rank li.is-top b, .rank li.is-top i { color: var(--sun); }
  .leaf--stamped { margin-bottom: 22px; }
  .leaf--stamped .leaf__rel { text-align: left; padding-left: 8px; }   /* 도장이 글자를 가리지 않게 */
  .stamp { position: absolute; right: -14px; bottom: -20px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--sun); box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--sun); background: var(--paper); color: var(--sun); font-size: 11px; font-weight: 800; line-height: 1.15; transform: rotate(-14deg); }

  .day__events { flex: 1; min-width: 0; }
  .ev + .ev { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .ev h2 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 800; }
  .ev__time { font: 700 21px/1 var(--num); margin-right: 7px; letter-spacing: 0.01em; }
  .ev__sub { margin: 3px 0 0; font-size: 14px; color: var(--ink-2); }
  .ev__count { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
  .ev__count b { font: 700 19px/1 var(--num); color: var(--ink); margin: 0 1px; }
  .grp { margin-top: 12px; }
  .grp h3 { margin: 0 0 6px; font-size: 13px; font-weight: 800; }
  .grp--wait h3, .grp--practice h3 { color: var(--ink-2); }
  .names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .names li { position: relative; }
  .names li > * { display: block; padding: 3px 9px; border: 1px solid var(--line); border-radius: 14px; font-size: 13px; line-height: 20px; background: none; max-width: 100%; text-align: left; }
  /* 생일 이벤트: 이름 칩의 오른쪽 위 모서리에 살짝 겹치는 +1 */
  .names li > .plus1 { position: absolute; top: -7px; right: -6px; z-index: 1; display: block; min-width: 22px; height: 18px; padding: 0 5px; border: 0; border-radius: 9px; box-sizing: border-box;
    background: #f2b21b; color: #1f2733; font: 800 11px/18px var(--num); letter-spacing: 0; text-align: center; box-shadow: 0 0 0 2px var(--paper); pointer-events: none; }
  .names li.is-bday > * { border-color: #f2b21b; }
  .bday-note { margin: 0 0 8px; padding: 8px 12px; border-radius: 8px; background: #fff3d1; color: #5a3d00; font-size: 14px; font-weight: 700; line-height: 1.4; }
  .bday-note b { font-weight: 800; }
  @media (prefers-color-scheme: dark) { .bday-note { background: #4a3a10; color: #ffe2a0; } }
  .names .no { font: 700 14px/1 var(--num); color: var(--ink-2); margin-right: 5px; }
  .names .by { font-size: 11px; color: var(--ink-2); margin-left: 5px; }
  .tagx { display: inline-block; margin-left: 5px; padding: 0 5px; border: 1px solid currentColor; border-radius: 8px; font-size: 11px; font-weight: 700; line-height: 15px; vertical-align: 1px; }
  .tagx--late { color: var(--sat); }
  .tagx--no { color: var(--sun); }
  .tagx--came { color: var(--go); }
  .tagx--staff { color: var(--ink-2); }
  .pick { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 2px; border-top: 1px solid var(--line); font-size: 15px; }
  .pick input { flex: none; width: 22px; height: 22px; }
  .pick small { color: var(--ink-2); }
  .tel { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 6px 2px; border-top: 1px solid var(--line); font-size: 15px; }
  .tel a { flex: none; color: var(--sat); font: 700 19px/1 var(--num); letter-spacing: 0.02em; text-decoration: none; }
  .tel small { color: var(--ink-2); }
  .linkbtn svg { vertical-align: -2px; margin-right: 3px; }
  .pickhead { margin: 14px 0 6px; font-size: 13px; font-weight: 800; }
  .pickhead small { font-weight: 400; color: var(--ink-2); }
  .names .is-me > * { border-color: var(--go); background: var(--go-bg); color: var(--go); font-weight: 700; }
  .names .is-me .no { color: inherit; }
  .grp--wait .names li > * { border-style: dashed; }
  .grp--practice .names li > * { border-color: transparent; background: var(--note-bg); }

  .act { margin-top: 12px; }
  .btn { display: block; width: 100%; min-height: 48px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 16px; font-weight: 700; }
  .btn--ghost { background: none; color: var(--ink); border-color: var(--line); }
  .btn--danger { background: var(--sun); border-color: var(--sun); color: #fff; }
  .btn[disabled] { background: var(--note-bg); border-color: var(--line); color: var(--ink-2); cursor: default; }
  .done { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 800; color: var(--go); }
  .done svg { flex: none; }
  .done--wait { color: var(--sat); }
  .done--new { animation: press .22s ease-out; }
  @keyframes press { from { transform: scale(1.12); opacity: .2; } to { transform: none; opacity: 1; } }
  .note { margin: 8px 0 0; padding: 8px 10px; border-radius: 6px; background: var(--note-bg); font-size: 13px; color: var(--ink-2); }
  .note--warn { color: var(--sun); }
  .act .note + .btn { margin-top: 8px; }
  .pair { display: flex; gap: 8px; margin-top: 8px; }
  .pair .btn { min-height: 42px; padding: 8px 10px; font-size: 15px; }
  .guest { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 4px 7px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
  .guest__who { flex: 1; min-width: 0; }
  .guest__who small { display: block; font-size: 12px; color: var(--ink-2); }
  .tools { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 6px; }
  .top__acts { flex: none; display: flex; align-items: center; gap: 12px; }
  .iconbtn { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--ink); }
  .feelink { min-height: 40px; padding: 8px 14px; border: 1px solid var(--ink); border-radius: 20px; background: none; font-size: 14px; font-weight: 700; }
  .cmts { margin-top: 12px; padding-top: 10px; border-top: 1px dotted var(--line); }
  .cmt { display: flex; align-items: baseline; gap: 6px; margin: 0 0 4px; font-size: 14px; }
  .cmt b { flex: none; font-weight: 700; }
  .cmt span { flex: 1; min-width: 0; }
  .cmt small { flex: none; font-size: 11px; color: var(--ink-2); }
  .cmt .linkbtn { flex: none; padding: 0 2px; font-size: 12px; }
  .cmt__edited { font-size: 11px; color: var(--ink-2); }
  .cmtform { display: flex; gap: 6px; margin-top: 6px; }
  .cmtform input { flex: 1; min-width: 0; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 15px; }
  .cmtform .btn { width: auto; min-height: 40px; padding: 6px 14px; font-size: 14px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 6px 0 4px; }
  .days button { min-height: 52px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; font-size: 17px; font-weight: 800; }
  .days button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .days .is-sat { color: var(--sat); } .days .is-sun { color: var(--sun); }
  .days button[aria-pressed="true"].is-sat, .days button[aria-pressed="true"].is-sun { color: var(--paper); }
  .price { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
  .price__row { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; margin-bottom: 4px; }
  .price__total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-weight: 800; }
  .price__total b { font: 700 30px/1 var(--num); }
  .plan { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: 14px; }
  .plan th, .plan td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
  .plan td:last-child { text-align: right; font-weight: 700; }
  .seg { display: flex; gap: 6px; margin-bottom: 14px; }
  .seg button { flex: 1; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; background: none; font-size: 15px; font-weight: 700; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

  .more { display: block; width: calc(100% - 32px); margin: 10px 16px; min-height: 44px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; background: none; font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .edge { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--ink-2); }
  .day--past { opacity: .72; }
  .day--past .leaf { background: var(--note-bg); }
  .empty { padding: 56px 24px; text-align: center; color: var(--ink-2); }
  .empty strong { display: block; margin-bottom: 6px; font-size: 17px; color: var(--ink); }
  .foot { margin: 8px 16px 0; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-2); }
  .foot p { margin: 0 0 4px; }

  /* 운영진 메뉴 */
  .panel { padding: 22px 16px 6px; }
  .panel + .panel { border-top: 1px dashed var(--line); }
  .panel h2 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  .panel > p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
  .req { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .req__who { flex: 1; min-width: 0; }
  .req__who b { display: block; font-size: 16px; }
  .req__who span { font-size: 13px; color: var(--ink-2); }
  .req__code { font: 700 26px/1 var(--num); letter-spacing: 0.06em; }
  .req .btn { width: auto; min-height: 40px; padding: 6px 14px; font-size: 14px; }
  .rec { padding: 14px 0 4px; border-top: 1px solid var(--line); }
  .rec h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .rec h3 small { margin-left: 6px; font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .rec .grp { margin-top: 8px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 15px; }
  .check input { width: 20px; height: 20px; }
  .result { margin: 0 0 12px; padding: 0 0 0 18px; font-size: 13px; color: var(--ink-2); }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 700; }
  .field small { font-weight: 400; color: var(--ink-2); }
  .field input, .field select, .field textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 16px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; min-width: 0; }

  /* 단독 화면(로그인·등록·대기 등) */
  .solo { padding: 56px 24px 32px; }
  .solo h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em; }
  .solo p { margin: 0 0 14px; color: var(--ink-2); }
  .solo ol { margin: 0 0 20px; padding-left: 20px; color: var(--ink-2); }
  .solo ol li { margin-bottom: 4px; }
  .solo .err { padding: 10px 12px; border-radius: 6px; background: var(--note-bg); color: var(--sun); font-size: 14px; }
  .kakao { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; margin: 22px 0 14px; border-radius: 8px; background: #FEE500; color: rgba(0, 0, 0, .85); font-size: 16px; font-weight: 700; text-decoration: none; }
  .code { margin: 4px 0 18px; padding: 18px 0 14px; text-align: center; border: 1px solid var(--line); border-radius: 4px; }
  .code b { display: block; font: 700 64px/1 var(--num); letter-spacing: 0.12em; text-indent: 0.12em; }
  .code span { font-size: 13px; color: var(--ink-2); }
  .solo .btn + .btn { margin-top: 8px; }
  .fine { font-size: 13px; }

  /* 확인 창 / 알림 */
  .veil { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 14, 20, .5); }
  .modal { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; padding: 22px 16px 18px; border-radius: 14px 14px 0 0; background: var(--paper); }
  .modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .modal p { margin: 0 0 16px; font-size: 15px; color: var(--ink-2); white-space: pre-line; }
  .modal textarea { width: 100%; min-height: 160px; margin-bottom: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 14px; }
  .modal .btn + .btn { margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 700; text-align: center; }
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: 3px; background: var(--sat); transform-origin: left; animation: load 1.6s ease-in-out infinite; }
  @keyframes load { 0% { transform: scaleX(0); } 60% { transform: scaleX(.8); } 100% { transform: scaleX(1); opacity: 0; } }
  .is-busy button, .is-busy a.kakao { pointer-events: none; opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .done--new, .bar { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="sheet"><div class="empty">불러오는 중이에요…</div></div></div>

<script>
(function () {
  'use strict';
  /*
   * 이 파일은 두 곳에서 똑같이 쓴다.
   *  (1) Apps Script 가 직접 내보내는 화면: BOOT 가 채워져 있고, 서버와는 google.script.run 으로 통신한다.
   *  (2) 내 주소(GitHub Pages)에 올린 화면: EXEC 에 웹앱 주소가 들어 있고, 서버와는 fetch 로 데이터만 주고받는다.
   *      화면이 구글 주소 안에서 열리지 않아 구글 안내 문구가 없고, PC에서 구글 계정을 여러 개 로그인한 경우의 오류와도 무관하다.
   */

    var list = d.events;
    var cursor = list.length ? (dir === 'past' ? list[0].date : list[list.length - 1].date) : d.today;
    S.loadingMore = true;
    var y = scrollTop_(), height = docHeight_();
    setBusy(true);
    call('moreEvents', { dir: dir, cursor: cursor }).then(function (r) {
      S.loadingMore = false; setBusy(false);
      if (dir === 'past') {

        d.hasPast = r.hasMore;
        if (d.events.length && S.range) S.range = { from: d.events[0].date, to: S.range.to, widened: true };
        S.scroll = { mode: 'shift', y: y, height: height };      // 위에 붙은 만큼 내려, 보던 자리를 유지
      } else {

        if (d.events.length && S.range) S.range = { from: S.range.from, to: d.events[d.events.length - 1].date, widened: true };

  function nextTop_() {

  }

  function afterRender() {
    var mode = (S.scroll && S.scroll.mode) || 'keep';
    if (mode === 'anchor') {
      window.scrollTo(0, nextTop_());
    } else if (mode === 'top') {
      window.scrollTo(0, 0);
    } else if (mode === 'shift') {
      window.scrollTo(0, Math.max(0, S.scroll.y + (docHeight_() - S.scroll.height)));
    } else if (typeof S.scroll.y === 'number') {
      window.scrollTo(0, S.scroll.y);

  var edgeWatcher = null, nextWatcher = null;
  function watchEdges() {
    if (edgeWatcher) { edgeWatcher.disconnect(); edgeWatcher = null; }
    if (nextWatcher) { nextWatcher.disconnect(); nextWatcher = null; }
    if (!window.IntersectionObserver || !S.data || S.data.stage !== 'ready' || S.tab !== 'events' || S.view !== 'main') return;
    var margin = '-' + stickHeight_() + 'px 0px 0px 0px';      // 고정된 머리말에 가려진 부분은 "보이는 것"으로 치지 않는다
    edgeWatcher = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        if (e.target.id === 'morePast') loadMore('past');
        if (e.target.id === 'moreFuture') loadMore('future');
      });
    }, { rootMargin: margin });     // 화면에 실제로 들어왔을 때만. 열자마자 자동으로 불러오지 않게 한다
    ['morePast', 'moreFuture'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && el.tagName === 'BUTTON') edgeWatcher.observe(el);
    });
    // 다가오는 모임이 화면 밖에 있을 때만 돌아가는 버튼을 보여 준다
    var next = document.querySelector('.day--next'), jump = document.getElementById('jump');

      jump.textContent = e.boundingClientRect.top < 0 ? '↑ 다가오는 모임으로' : '↓ 다가오는 모임으로';   // 위에 있으면 ↑, 아래에 있으면 ↓
      jump.removeAttribute('hidden');
    }, { rootMargin: margin });
    nextWatcher.observe(next);
  }

        text: dayLabel(ev.date) + '  ' + ev.title + '\n이름(년생)과 연락처예요. 게스트는 빠져 있어요. 번호를 누르면 전화가 걸립니다. 조회 기록이 남아요.' });
    }, function (err) { setBusy(false); if (!handleAuth(err)) toast(err.message || '불러오지 못했어요.'); });
  }

  function eventBlock(ev, d) {
    var el = h('article', { class: 'ev' },
      h('h2', null, ev.time ? h('span', { class: 'ev__time', text: ev.time }) : null, ev.title),
      ev.place ? h('p', { class: 'ev__sub', text: ev.place }) : null,
      ev.memo ? h('p', { class: 'ev__sub', text: ev.memo }) : null,
      h('p', { class: 'ev__count' },
        h('span', null, '참석 ', h('b', { text: String(ev.confirmedCount) }), '명', ev.capacity ? ' / 정원 ' + ev.capacity + '명' : ''),
        ev.waitCount ? h('span', null, '대기 ', h('b', { text: String(ev.waitCount) }), '명') : null,
        ev.practiceCount ? h('span', null, '연습 ', h('b', { text: String(ev.practiceCount) }), '명') : null));

    add(el, group('참석 확정', ev.confirmed, 'confirmed', ev, d));
    add(el, group('대기', ev.waiting, 'waiting', ev, d));
    add(el, group('연습', ev.practice, 'practice', ev, d));

    var box = h('div', { class: 'act' });
    if (ev.my) {
      var practice = ev.my.kind === '연습';
      var label = (practice ? '연습으로 신청했어요' : ev.my.waiting ? '대기 ' + ev.my.no + '번이에요' : '참석 확정이에요') + (ev.my.late ? ' (급참)' : '');
      box.appendChild(h('div', { class: 'done' + (ev.my.waiting ? ' done--wait' : '') + (S.justApplied === ev.id ? ' done--new' : '') },
        ev.my.waiting ? waitIcon() : checkIcon(), label));
      if (ev.my.waiting) box.appendChild(h('p', { class: 'note', text: '앞에서 취소가 나오면 순서대로 참석 확정이 돼요. 대기 중에는 언제든 취소할 수 있어요.' }));
      if (ev.my.canCancel) {
        box.appendChild(h('button', { class: 'btn btn--ghost', type: 'button', text: practice ? '연습 취소' : '신청 취소', onclick: function () { cancel(ev); } }));
        if (ev.date === d.tomorrow && !ev.my.waiting) box.appendChild(h('p', { class: 'note note--warn', text: '오늘 밤 12시가 지나면 취소할 수 없어요.' }));
      } else {
        box.appendChild(h('p', { class: 'note', text: '모임 당일이라 취소할 수 없어요. 사정이 생기면 운영진에게 알려 주세요.' }));
      }
    } else if (ev.open) {
      box.appendChild(h('button', { class: 'btn', type: 'button', text: ev.full ? '대기로 신청하기' : ev.isToday ? '급참 신청하기' : '신청하기', onclick: function () { apply(ev, '참석'); } }));
      if (ev.full) box.appendChild(h('p', { class: 'note', text: '정원이 차서 대기 ' + (ev.waitCount + 1) + '번으로 신청돼요. 앞에서 취소가 나오면 순서대로 참석 확정이 됩니다.' + (ev.isToday ? ' 오늘 신청은 급참으로 기록돼요.' : '') }));
      else if (ev.isToday) box.appendChild(h('p', { class: 'note note--warn', text: '오늘 0시가 지나 급참이에요. 급참비 ' + won(d.lateFee) + '이 추가되고 취소할 수 없어요. (' + d.lateClose + ' 마감)' }));
    } else {
      box.appendChild(h('p', { class: 'note', text: ev.isToday ? '오늘 모임 신청은 마감됐어요.' : '신청이 마감됐어요.' }));
    }

    if (ev.open && (!ev.my || ev.canGuest)) {
      box.appendChild(h('div', { class: 'pair' },
        !ev.my ? h('button', { class: 'btn btn--ghost', type: 'button', text: '연습 신청', onclick: function () { apply(ev, '연습'); } }) : null,
        ev.canGuest ? h('button', { class: 'btn btn--ghost', type: 'button', text: '게스트 신청', onclick: function () { guestAdd(ev, d); } }) : null));
    }

    (ev.myGuests || []).forEach(function (g) {
      box.appendChild(h('div', { class: 'guest' },
        h('div', { class: 'guest__who' }, '게스트 ' + g.name,
          h('small', { text: (g.waiting ? '대기 ' + g.no + '번' : '참석 확정') + (g.canCancel ? '' : ', 당일이라 취소할 수 없어요') })),
        g.canCancel ? h('button', { class: 'linkbtn', type: 'button', text: '취소', 'aria-label': '게스트 ' + g.name + ' 취소', onclick: function () { guestCancel(ev, g); } }) : null));
    });
    el.appendChild(box);
    if (ev.started) {
      el.appendChild(h('p', { class: 'note', text: ev.locked ? '출결 확정됨 (' + ev.locked + '). 고칠 내용은 운영진에게 알려 주세요.'
        : ev.canMark ? '노쇼 체크 중이에요. 안 나온 사람이 있으면 [노쇼 체크]나 이름을 눌러 표시해 주세요. 운영진이 확정하면 마감됩니다.' : '운영진의 출결 확정을 기다리고 있어요.' }));
    }
    add(el, staffTools(ev));
    if (ev.comments) el.appendChild(commentBox(ev));
    return el;
  }

  function apply(ev, kind) {
    var practice = kind === '연습';
    var go = ev.isToday && !(ev.full && !practice)
      ? ask({ title: practice ? '오늘 모임에 연습으로 급참할까요?' : '오늘 모임에 급참할까요?', text: '급참비 ' + won(S.data.lateFee) + '이 추가되고, 신청하면 취소할 수 없어요.', ok: practice ? '연습 급참' : '급참 신청' })
      : Promise.resolve(true);
    go.then(function (yes) {
      if (!yes) return;
      S.justApplied = ev.id;
      act('apply', { eventId: ev.id, kind: kind }, function (data) {
        var now = findEvent(data, ev.id);
        if (!now || !now.my) return '신청했어요';
        if (now.my.kind === '연습') return '연습으로 신청했어요';
        return now.my.waiting ? '대기 ' + now.my.no + '번으로 신청했어요' : now.my.late ? '급참으로 참석 확정이에요' : '참석 확정이에요';
      }).then(function () { S.justApplied = ''; });
    });
  }

  function cancel(ev) {
    var practice = ev.my && ev.my.kind === '연습';
    ask({ title: practice ? '연습 신청을 취소할까요?' : '신청을 취소할까요?', text: dayLabel(ev.date) + '\n' + ev.title, ok: practice ? '연습 취소' : '신청 취소', danger: true })
      .then(function (yes) { if (yes) act('cancel', { eventId: ev.id }, practice ? '연습 신청을 취소했어요' : '신청을 취소했어요'); });
  }

  function guestAdd(ev, d) {
    var input = h('input', { type: 'text', maxlength: '20', autocomplete: 'off', placeholder: '예: 홍길동' });
    var text = '명단에 "게스트 이름 (게스트, ' + d.me.nickname + ' 등록)"으로 표시되고 정원에 포함돼요.'
      + (ev.full ? '\n지금은 정원이 차서 대기로 들어가요.' : '')
      + (ev.guestPending ? '\n모임 전날 ' + d.guestCutoff + ' 전까지는 회원이 먼저라, 게스트는 그 시각에 남은 자리가 있으면 확정돼요.' : '')
      + (ev.isToday && !ev.full ? '\n오늘 신청은 급참이라 급참비 ' + won(d.lateFee) + '이 추가되고 취소할 수 없어요.' : '');
    ask({ title: '게스트 신청', text: text, body: h('label', { class: 'field' }, h('span', { text: '게스트 이름' }), input), ok: '게스트 신청',
      check: function () { if (input.value.trim()) return true; toast('게스트 이름을 입력해 주세요.'); input.focus(); return false; } })
      .then(function (yes) {
        if (!yes) return;
        var name = input.value.trim();
        act('guestAdd', { eventId: ev.id, name: name }, name + ' 님을 게스트로 신청했어요');
      });
    input.focus();
  }

  function guestCancel(ev, g) {
    ask({ title: '게스트 ' + g.name + ' 님의 신청을 취소할까요?', text: dayLabel(ev.date) + '\n' + ev.title, ok: '게스트 취소', danger: true })
      .then(function (yes) { if (yes) act('guestCancel', { eventId: ev.id, name: g.name }, '게스트 신청을 취소했어요'); });
  }

  /* ---------- 운영진: 취소 처리 / 추가 등록 / 노쇼 체크 ---------- */
  function staffCall(action, payload, doneMsg) {
    if (document.body.classList.contains('is-busy')) return Promise.resolve(false);
    payload.recent = !!S.recent;                       // 출석 체크 목록을 열어 둔 경우 그 목록도 함께 새로 받는다
    setBusy(true);
    return call(action, payload).then(function (r) {
      setBusy(false); keepRange(r.state); if (r.recent) S.recent = r.recent; render();
      if (doneMsg) toast(doneMsg);
      return true;
    }, function (err) {
      setBusy(false);
      if (handleAuth(err)) return false;
      toast(err.message || '처리하지 못했어요.');
      return false;
    });
  }

  function keyOf(ev, a) {                                  // 운영진은 회원번호로, 일반 회원은 서버가 준 키(k)로 명단의 한 줄을 가리킨다
    return a.id ? { eventId: ev.id, memberId: a.id, kind: a.kind, guestName: a.kind === '게스트' ? a.name : '' } : { eventId: ev.id, k: a.k };
  }

  /** 운영진이 명단의 이름을 눌렀을 때: (시작된 모임이면) 노쇼·나옴 표시, 그리고 운영진 권한 취소 처리 */
  function entryMenu(ev, a, where) {
    var who = a.kind === '게스트' ? a.name + ' 님(게스트, ' + a.by + ' 등록)' : a.name + ' 님' + (where === 'practice' ? '(연습)' : '');
    var options = [];
    if (ev.canMark) {
      if (where === 'waiting') options.push(a.mark === '참석' ? { label: '나옴 표시 해제', value: '' } : { label: '대기였지만 나왔어요(대기참)', value: '참석' });
      else options.push(a.mark === '노쇼' ? { label: '노쇼 표시 해제', value: '' } : { label: '노쇼로 표시', value: '노쇼', danger: true });
    }
    if (ev.canMark && a.kind !== '게스트') options.push(a.ft ? { label: '🥤 자유투 꼴찌 해제', value: 'ft-clear' } : { label: '🥤 자유투 꼴찌로 표시', value: 'ft' });
    if (S.data.me.isStaff) options.push({ label: '신청 취소 처리 (운영진 권한)', value: 'remove' });
    if (!options.length) return;
    choose({ title: who, text: dayLabel(ev.date) + '\n' + ev.title + (a.staff ? '\n' + a.staff + ' 님이 운영진 권한으로 등록' : '')
        + (ev.started && where === 'practice' ? '\n연습도 안 나오면 노쇼비가 부과돼요.' : ''), options: options })
      .then(function (v) {
        if (v === null) return;
        var key = keyOf(ev, a);
        if (v === 'ft' || v === 'ft-clear') { var fk = keyOf(ev, a); if (v === 'ft-clear') fk.clear = true; staffCall('freethrow', fk, v === 'ft' ? a.name + ' 님을 자유투 꼴찌로 표시했어요' : '자유투 꼴찌를 해제했어요'); return; }
        if (v !== 'remove') { key.mark = v; staffCall('attendMark', key, v ? v === '노쇼' ? '노쇼로 표시했어요' : '나온 것으로 표시했어요' : '표시를 해제했어요'); return; }
        ask({ title: who + '의 신청을 취소 처리할까요?', ok: '취소 처리', danger: true,
          text: '운영진 권한으로 처리하며, 마감(당일 0시) 뒤에도 할 수 있어요. 누가 처리했는지 기록에 남습니다. 확정 자리가 비면 대기 1번이 자동으로 올라와요.' })
          .then(function (yes) { if (yes) staffCall('staffRemove', key, '운영진 권한으로 취소 처리했어요'); });
      });
  }

  function staffAdd(ev) {
    var inIds = {};
    (ev.confirmed || []).concat(ev.waiting || [], ev.practice || []).forEach(function (a) { if (a.kind !== '게스트') inIds[a.id] = true; });
    var rest = ((S.data.staff && S.data.staff.members) || []).filter(function (m) { return !inIds[m.id]; });
    if (!rest.length) { toast('모든 회원이 이미 명단에 있어요.'); return; }
    var who = h('select', { 'aria-label': '회원' }, rest.map(function (m) { return h('option', { value: m.id, text: m.nickname }); }));
    var kind = h('select', { 'aria-label': '구분' }, h('option', { value: '참석', text: '참석' }), h('option', { value: '연습', text: '연습' }));
    var sameDayOrPast = ev.date <= S.data.today;
    var late = h('input', { type: 'checkbox', checked: sameDayOrPast });
    ask({ title: '운영진 권한으로 추가 등록', ok: '추가 등록',
      text: dayLabel(ev.date) + '  ' + ev.title + '\n마감 뒤에도 등록할 수 있어요. 명단에 "운영진 등록"으로 표시되고 기록에 남습니다.'
        + (ev.started ? '\n이미 시작된 모임이라 실제로 나온 것으로 기록돼요.' : ''),
      body: h('div', null, h('label', { class: 'field' }, h('span', { text: '회원' }), who), h('label', { class: 'field' }, h('span', { text: '구분' }), kind),
        sameDayOrPast ? h('label', { class: 'check' }, late, '급참비 부과 (당일 신청인 경우)') : null) })
      .then(function (yes) { if (yes) staffCall('staffAdd', { eventId: ev.id, memberId: who.value, kind: kind.value, late: sameDayOrPast && late.checked }, '운영진 권한으로 등록했어요'); });
  }

  function confirmAttend(ev) {
    if (ev.locked) {
      ask({ title: '출결 확정을 해제할까요?', text: dayLabel(ev.date) + '  ' + ev.title + '\n해제하면 회원들도 다시 노쇼 체크를 고칠 수 있어요(당일에 한해).', ok: '확정 해제' })
        .then(function (yes) { if (yes) staffCall('attendConfirm', { eventId: ev.id, unlock: true }, '출결 확정을 해제했어요'); });
      return;
    }
    var noshow = (ev.confirmed || []).concat(ev.practice || []).filter(function (a) { return a.mark === '노쇼'; }).map(function (a) { return a.name; });
    var came = (ev.waiting || []).filter(function (a) { return a.mark === '참석'; }).map(function (a) { return a.name; });
    ask({ title: '이대로 출결을 확정할까요?', ok: '출결 확정',
      text: dayLabel(ev.date) + '  ' + ev.title + '\n노쇼 ' + noshow.length + '명' + (noshow.length ? ': ' + noshow.join(', ') : '') + '\n대기참 ' + came.length + '명' + (came.length ? ': ' + came.join(', ') : '')
        + '\n\n확정하면 회원들은 더 고칠 수 없고 운영진만 고칠 수 있어요.' })
      .then(function (yes) { if (yes) staffCall('attendConfirm', { eventId: ev.id }, '출결을 확정했어요'); });
  }

  /** 노쇼 체크: 안 나온 사람(확정·연습)과 대기였지만 나온 사람을 한 번에 고르고 저장한다. */
  function noShowCheck(ev) {
    var picks = [];
    function rows(list, where) {
      return (list || []).map(function (a, i) {
        var box = h('input', { type: 'checkbox', checked: where === 'waiting' ? a.mark === '참석' : a.mark === '노쇼' });
        picks.push({ a: a, where: where, box: box });
        return h('label', { class: 'pick' }, box, h('span', null, (i + 1) + '. ' + a.name,
          a.kind === '게스트' ? h('small', { text: '  게스트, ' + a.by + ' 등록' }) : null, a.late ? h('small', { text: '  급참' }) : null));
      });
    }
    // 자유투 꼴찌(음료수 당번): 회원 한 명을 고른다
    var ftRadios = [], ftName = 'ft-' + ev.id;
    function ftRow(a, label) {
      var r = h('input', { type: 'radio', name: ftName, checked: !!a && !!a.ft });
      ftRadios.push({ a: a, box: r });
      return h('label', { class: 'pick' }, r, h('span', { text: label }));
    }
    var players = (ev.confirmed || []).concat(ev.waiting || [], ev.practice || []).filter(function (a) { return a.kind !== '게스트'; });
    var ftBody = players.length ? [h('p', { class: 'pickhead' }, '🥤 자유투 꼴찌 ', h('small', { text: '음료수 당번 한 명' })), ftRow(null, '없음')]
      .concat(players.map(function (a) { return ftRow(a, a.name); })) : null;
    if (ftBody && !players.some(function (a) { return a.ft; })) ftRadios[0].box.checked = true;
    var body = h('div', null,
      (ev.confirmed || []).length ? h('p', { class: 'pickhead' }, '참석 확정 ', h('small', { text: '안 나온 사람을 체크' })) : null, rows(ev.confirmed, 'confirmed'),
      (ev.practice || []).length ? h('p', { class: 'pickhead' }, '연습 ', h('small', { text: '안 나온 사람을 체크 (노쇼비 부과)' })) : null, rows(ev.practice, 'practice'),
      (ev.waiting || []).length ? h('p', { class: 'pickhead' }, '대기 ', h('small', { text: '실제로 나온 사람을 체크 (대기참)' })) : null, rows(ev.waiting, 'waiting'),
      ftBody);
    if (!picks.length) { toast('명단이 비어 있어요.'); return; }
    ask({ title: '노쇼 체크', text: dayLabel(ev.date) + '  ' + ev.title + '\n체크하지 않은 확정자는 나온 것으로 정산돼요. 저장한 뒤에도 다시 열어 고칠 수 있어요.', body: body, ok: '저장' })
      .then(function (yes) {
        if (!yes) return;
        var noshow = [], came = [], ft = null;
        picks.forEach(function (p) { if (p.box.checked) (p.where === 'waiting' ? came : noshow).push(keyOf(ev, p.a)); });
        ftRadios.forEach(function (p) { if (p.box.checked && p.a) ft = keyOf(ev, p.a); });
        var payload = { eventId: ev.id, noshow: noshow, came: came };
        if (ftRadios.length) payload.freethrow = ft;                        // 없음을 고르면 null(해제)
        staffCall('attendCheck', payload, '노쇼 ' + noshow.length + '명' + (came.length ? ', 대기참 ' + came.length + '명' : '') + (ft ? ', 꼴찌 1명' : '') + '으로 저장했어요');
      });
  }

  function adminView(d) {

      h('button', { type: 'button', 'aria-pressed': String(pick.paid === true), text: '입금했어요', onclick: function () { pick.paid = true; render(); } }),
      h('button', { type: 'button', 'aria-pressed': String(pick.paid === false), text: '24시간 안에 입금할게요', onclick: function () { pick.paid = false; render(); } })));
    panel.appendChild(h('button', { class: 'btn', type: 'button', text: mm + '월 회비 신청하기', onclick: function () {
      var days = Object.keys(pick.days).filter(function (w) { return pick.days[w]; });
      if (!days.length) { toast('요일을 하나 이상 골라 주세요.'); return; }
      if (pick.paid === null) { toast('입금 여부를 골라 주세요.'); return; }
      if (document.body.classList.contains('is-busy')) return;
      setBusy(true);
      call('feeApply', { month: cur.month, days: days, paid: pick.paid }).then(function (r) {
        setBusy(false); S.fee = r; S.feePick = { month: cur.month, days: {}, paid: null }; render(); window.scrollTo(0, 0);
        toast(mm + '월 회비를 신청했어요. ' + won(plan.total));
      }, function (err) { setBusy(false); if (!handleAuth(err)) toast(err.message || '신청하지 못했어요.'); });
    } }));
    mount(root);
  }

  /* ---------- 시작 ---------- */
  function render() {
    var d = S.data;
    if (!d) return;
    if (S.view === 'fee' && S.fee && d.stage === 'ready') return renderFee();
    if (d.stage === 'register' || S.editName) return renderRegister(d);
    if (d.stage === 'pending') return renderPending(d);
    if (d.stage === 'blocked') return solo(h('h1', { text: '이용이 제한된 계정이에요' }), h('p', { text: '운영진에게 문의해 주세요.' }));
    renderMain(d);
  }

  function start() {
    if (!BOOT.configured) { renderSetup(); return; }
    if (BOOT.kakaoOnly && !/KAKAOTALK/i.test(navigator.userAgent)) { renderGate(); return; }
    if (BOOT.tokenRejected) store.clear();                 // 보관하던 로그인 정보가 만료됨: 지운다
    if (BOOT.token) store.set(BOOT.token);
    S.token = BOOT.token || store.get();
    if (!S.token) { renderLogin(BOOT.error); return; }
    if (!BOOT.token) tellWrapper('token', { token: S.token });   // 이쪽 저장소에만 남아 있던 경우: 껍데기에도 맡긴다
    tellWrapper('ready');
    if (BOOT.state && BOOT.token) { keepRange(BOOT.state); render(); }   // 서버가 첫 화면 내용을 함께 보내 준 경우
    else load();
  }

  if (!REMOTE) { start(); return; }

  // ── 내 주소(GitHub Pages)에서 열린 경우 ──
  if (window.top !== window.self) {                       // 다른 사이트가 이 화면을 끼워 넣은 경우에는 동작하지 않는다
    solo(h('p', { text: '이 페이지는 다른 사이트 안에서는 열 수 없어요.' }));
    try { window.top.location = window.location.href; } catch (e) { /* 무시 */ }
    return;
  }
  var q = {};
  window.location.search.replace(/[?&]([^=&#]+)=([^&#]*)/g, function (_, k, v) { q[k] = decodeURIComponent(v.replace(/\+/g, ' ')); });
  CAME_BACK = !!(q.code || q.error);
  if (CAME_BACK && window.history && window.history.replaceState) window.history.replaceState(null, '', window.location.pathname);   // 주소창의 인가 코드는 바로 지운다
  var selfUrl = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '/');

  function boot() {
    var ask = { back: selfUrl };
    if (q.code && q.state) { ask.code = q.code; ask.state = q.state; }
    else if (!q.error) ask.t = store.get();               // 자동 로그인이 안 돼서 돌아온 경우(q.error)는 그냥 로그인 화면으로
    q = {};                                               // 인가 코드는 한 번만 쓴다
    // 지난번에 본 화면이 있으면 먼저 보여 준다(위쪽 진행 막대가 도는 동안 최신 내용을 받아 와 바꿔 그린다)
    var early = ask.t ? loadSnapshot(ask.t) : null;
    if (early) { S.token = ask.t; S.data = early; S.range = { from: early.from, to: early.to }; S.stale = true; render(); setBusy(true); }
    else solo(h('p', { text: '불러오는 중이에요…' }));
    post('boot', '', ask).then(function (b) {
      setBusy(false); S.stale = false; BOOT = b;
      if (early && !b.token) { S.data = null; }           // 로그인이 풀렸다면 기억해 둔 화면은 버린다
      if (early && b.state && b.state.today !== early.today) S.scroll = { mode: 'anchor' };   // 날짜가 바뀌었으면 다가오는 모임 위치로 다시 맞춘다
      start();
    }, function (err) {
      setBusy(false);
      if (early) { toast('최신 내용을 받지 못했어요. 지난번에 본 화면이에요.'); S.stale = true; return; }
      solo(h('h1', { text: '연결하지 못했어요' }), h('p', { text: (err && err.message) || '잠시 후 다시 시도해 주세요.' }),
        h('button', { class: 'btn', type: 'button', text: '다시 시도', onclick: boot }));
    });
  }
  boot();
})();
</script>
</body>
</html>
